<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Shop Game 🍕</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Press Start 2P', cursive;
            background: #1a1a2e;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        #game-canvas {
            position: relative;
            width: 960px;
            height: 640px;
            background: #2d2d44;
            border: 8px solid #ff6b6b;
            box-shadow: 0 0 0 4px #ffd93d, 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            background-size: cover;
            background-position: center;
        }
        .scene.active {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #character {
            position: absolute;
            width: 100px;
            height: 100px;
            transition: left 0.3s ease, bottom 0.3s ease;
            image-rendering: pixelated;
            z-index: 10;
        }
        #owner {
            position: absolute;
            width: 100px;
            height: 100px;
            right: 160px;
            bottom: 195px;
            image-rendering: pixelated;
            z-index: 9;
            display: none;
        }
        .clickable {
            position: absolute;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            z-index: 5;
        }
        .clickable:hover {
            transform: scale(1.05);
            filter: brightness(1.2) drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
        }
        #pizza-shop-exterior {
            width: 300px;
            height: 300px;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            mix-blend-mode: multiply;
            filter: contrast(1.05);
        }
        #counter-bell {
            position: absolute;
            left: 160px;
            bottom: 235px;
            width: 160px;
            height: 160px;
            font-size: 0px;
            background: transparent;
            border: none;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
        }
        #menu-board {
            width: 250px;
            height: 200px;
            left: 100px;
            top: 80px;
            display: none;
        }
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background: rgba(26, 26, 46, 0.95);
            border: 4px solid #ff6b6b;
            border-radius: 12px;
            padding: 20px 30px;
            color: #fff;
            font-size: 14px;
            line-height: 1.8;
            display: none;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
        }
        .dialogue-box.active { display: block; }
        .dialogue-text { margin-bottom: 15px; }
        .dialogue-options { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .option-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: #fff;
            border: 3px solid #ffd93d;
            padding: 12px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 8px;
            box-shadow: 0 4px 0 #c44569;
            flex: 1;
            min-width: 150px;
        }
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c44569, 0 8px 20px rgba(255,107,107,0.4);
        }
        .option-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c44569; }
        #menu-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 600px;
            background: rgba(255, 255, 255, 0.98);
            border: 6px solid #ff6b6b;
            border-radius: 16px;
            padding: 30px;
            z-index: 200;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        #menu-display.show { transform: translate(-50%, -50%) scale(1); }
        .menu-item {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border: 3px solid #e17055;
            border-radius: 12px;
            padding: 15px;
            margin: 12px 0;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #2d3436;
            font-size: 11px;
            box-shadow: 0 4px 0 #d63031;
        }
        .menu-item:hover {
            transform: translateX(10px) scale(1.02);
            box-shadow: 0 6px 0 #d63031, 0 8px 25px rgba(209,48,48,0.3);
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: #ff6b6b;
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            box-shadow: 0 4px 0 #c44569;
            transition: all 0.2s ease;
        }
        .close-btn:hover { transform: rotate(90deg); background: #ee5a6f; }
        #cart-summary {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,215,61,0.95);
            border: 4px solid #ff6b6b;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 12px;
            color: #2d2d44;
            min-width: 200px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            z-index: 150;
        }
        .cart-item {
            margin: 8px 0; padding: 8px;
            background: rgba(255,255,255,0.7);
            border-radius: 6px; font-size: 9px;
        }
        #instructions-outside, #instructions-counter {
            position: absolute;
            bottom: 20px; left: 20px;
            background: rgba(255,215,61,0.9);
            border: 3px solid #ff6b6b;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 10px;
            color: #2d2d44;
            max-width: 300px;
            z-index: 150;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        .bell-ring { animation: ringBell 0.5s ease; }
        @keyframes ringBell { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-15deg)} 75%{transform:rotate(15deg)} }
        #payment-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(26, 26, 46, 0.98);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            color: #fff;
            padding: 40px;
        }
        #payment-screen.show { display: flex; }
        .bill-display {
            background: rgba(255,255,255,0.1);
            border: 4px solid #ffd93d;
            border-radius: 12px;
            padding: 30px;
            margin: 20px 0;
            font-size: 12px;
            max-width: 600px;
            width: 100%;
        }
        .bill-line { margin: 10px 0; padding: 8px 0; border-bottom: 2px dotted rgba(255,255,255,0.3); }
        .payment-input {
            background: rgba(255,255,255,0.2);
            border: 3px solid #ff6b6b;
            border-radius: 8px;
            padding: 15px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            color: #fff;
            text-align: center;
            width: 300px;
            margin: 20px 0;
        }
        .payment-input::placeholder { color: rgba(255,255,255,0.5); }
        .payment-btn {
            background: linear-gradient(135deg, #6BCF7F 0%, #4CAF50 100%);
            color: #fff;
            border: 3px solid #ffd93d;
            padding: 15px 40px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 6px 0 #388E3C;
            transition: all 0.2s ease;
            margin: 10px;
        }
        .payment-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #388E3C; }
        .payment-btn:active { transform: translateY(2px); box-shadow: 0 4px 0 #388E3C; }
        .error-msg { color: #ff6b6b; font-size: 11px; margin: 10px 0; min-height: 20px; }
        .success-screen { text-align: center; animation: bounceIn 0.6s ease; }
        @keyframes bounceIn { 0%{transform:scale(0)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }
        .pizza-emoji { font-size: 80px; animation: spin 2s linear infinite; }
        @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        #addon-prompt {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.98);
            border: 4px solid #ff6b6b;
            border-radius: 16px;
            padding: 30px;
            z-index: 250;
            display: none;
            min-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        #addon-prompt.show { display: block; animation: slideUp 0.3s ease; }
        .addon-section { margin: 20px 0; color: #fff; }
        .addon-controls {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            background: rgba(255,255,255,0.1);
            padding: 15px; border-radius: 8px;
        }
        .counter-btn {
            background: #ff6b6b; color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%;
            font-size: 20px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 0 #c44569; transition: all 0.2s ease;
        }
        .counter-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #c44569; }
        .counter-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c44569; }
        .counter-value { font-size: 24px; color: #ffd93d; min-width: 60px; text-align: center; }
    </style>
</head>
<body>
<div id="game-container">
  <div id="game-canvas">
    <!-- Scene 1: Outside -->
    <div id="scene-outside" class="scene active">
      <img id="character" src="" alt="Character">
      <div id="pizza-shop-exterior" class="clickable"></div>
      <div id="instructions-outside">Click on the pizza shop to enter! 🍕</div>
    </div>
    <!-- Scene 2: Counter -->
    <div id="scene-counter" class="scene">
      <img id="character-counter" src="" alt="Character" style="position:absolute;width:100px;height:100px;left:100px;bottom:150px;image-rendering:pixelated;">
      <img id="owner" src="" alt="Owner">
      <div id="counter-bell" class="clickable" >🔔</div>
      <div id="menu-board" class="clickable"></div>
      <div id="instructions-counter" style="display:none;">Ring the bell to call the owner! 🔔</div>
    </div>
    <!-- Dialogue -->
    <div id="dialogue-box" class="dialogue-box">
      <div id="dialogue-text" class="dialogue-text"></div>
      <div id="dialogue-options" class="dialogue-options"></div>
    </div>
    <!-- Menu Display -->
    <div id="menu-display">
      <button class="close-btn" onclick="closeMenu()">×</button>
      <h2 style="color:#ff6b6b;margin-bottom:20px;font-size:16px;text-align:center;">🍕 PIZZA MENU 🍕</h2>
      <div id="menu-list"></div>
    </div>
    <!-- Addon Prompt -->
    <div id="addon-prompt">
      <h3 style="color:#ffd93d;margin-bottom:20px;text-align:center;">Customize Your Pizza</h3>
      <div class="addon-section">
        <label style="color:#fff;font-size:12px;">Extra Cheese (+100 each)</label>
        <div class="addon-controls">
          <button class="counter-btn" onclick="changeAddon('cheese',-1)">-</button>
          <span class="counter-value" id="cheese-count">0</span>
          <button class="counter-btn" onclick="changeAddon('cheese',1)">+</button>
        </div>
      </div>
      <div class="addon-section">
        <label style="color:#fff;font-size:12px;">Extra Toppings (+150 each)</label>
        <div class="addon-controls">
          <button class="counter-btn" onclick="changeAddon('toppings',-1)">-</button>
          <span class="counter-value" id="toppings-count">0</span>
          <button class="counter-btn" onclick="changeAddon('toppings',1)">+</button>
        </div>
      </div>
      <div style="text-align:center;margin-top:30px;">
        <button class="option-btn" onclick="confirmAddons()">Continue →</button>
      </div>
    </div>
    <!-- Cart -->
    <div id="cart-summary" style="display:none;">
      <h3 style="color:#ff6b6b;margin-bottom:10px;font-size:13px;">🛒 Your Order</h3>
      <div id="cart-items"></div>
      <div style="border-top:2px solid #ff6b6b;margin-top:10px;padding-top:10px;font-weight:bold;">
        Total: <span id="cart-total">0</span> TK
      </div>
    </div>
    <!-- Payment -->
    <div id="payment-screen">
      <div class="bill-display" id="final-bill"></div>
      <input type="number" id="payment-amount" class="payment-input" placeholder="Enter amount..." step="10">
      <div class="error-msg" id="payment-error"></div>
      <button class="payment-btn" onclick="processPayment()">Pay Now 💰</button>
    </div>
  </div>
</div>

const gameState = {
  currentScene: 'outside',
  order: [],
  orderCounter: 1000,
  currentPizza: null,
  totalAmount: 0,
  addons: { cheese: 0, toppings: 0 }
};

const pizzaTypes = {
  VEG:          { name: 'Regular Veg',     price: 300 },
  NON_VEG:      { name: 'Regular Non-Veg', price: 400 },
  DELUX_VEG:    { name: 'Delux Veg',       price: 550, includesAddons: true },
  DELUX_NON_VEG:{ name: 'Delux Non-Veg',   price: 650, includesAddons: true }
};

const EXTRA_CHEESE_PRICE   = 100;
const EXTRA_TOPPINGS_PRICE = 150;
const TAKEAWAY_PRICE       = 20;

window.onload = function() {
  // Backgrounds
  document.getElementById('scene-outside').style.backgroundImage  = 'url(' + IMGS.bg   + ')';
  document.getElementById('scene-counter').style.backgroundImage  = 'url(' + IMGS.reg  + ')';

  // Characters
  document.getElementById('character').src         = IMGS.ui;
  document.getElementById('character-counter').src = IMGS.um;
  document.getElementById('owner').src             = IMGS.om;

  // Pizza shop exterior
  const ext = document.getElementById('pizza-shop-exterior');
  ext.style.backgroundImage    = 'url(' + IMGS.shop + ')';
  ext.style.backgroundSize     = 'contain';
  ext.style.backgroundRepeat   = 'no-repeat';
  ext.style.backgroundPosition = 'center';

  // Menu board
  const mb = document.getElementById('menu-board');
  mb.style.backgroundImage    = 'url(' + IMGS.menu + ')';
  mb.style.backgroundSize     = 'cover';
  mb.style.backgroundPosition = 'center';

  // Position character
  const char = document.getElementById('character');
  char.style.left      = '50%';
  char.style.bottom    = '50px';
  char.style.transform = 'translateX(-50%)';

  // Events
  document.getElementById('pizza-shop-exterior').onclick = enterShop;
  document.getElementById('counter-bell').onclick        = ringBell;
  document.getElementById('menu-board').onclick          = showMenu;

  populateMenu();
};

function populateMenu() {
  const menuList = document.getElementById('menu-list');
  menuList.innerHTML = '';
  Object.entries(pizzaTypes).forEach(([key, pizza]) => {
    const item = document.createElement('div');
    item.className = 'menu-item';
    item.innerHTML = '<strong>' + pizza.name + '</strong><br>Price: ' + pizza.price + ' TK<br>' +
      (pizza.includesAddons ? '<em>(includes cheese + toppings)</em>' : '');
    item.onclick = () => selectPizza(key);
    menuList.appendChild(item);
  });
}

function enterShop() {
  document.getElementById('character').src = IMGS.um;
  setTimeout(() => {
    changeScene('counter');
    document.getElementById('character').src = IMGS.um;
    const bell = document.getElementById('counter-bell');
    bell.style.display = 'flex';
    document.getElementById('instructions-outside').style.display = 'none';
    document.getElementById('instructions-counter').style.display = 'block';
  }, 800);
}

function changeScene(name) {
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  document.getElementById('scene-' + name).classList.add('active');
  gameState.currentScene = name;
}

function ringBell() {
  const bell = document.getElementById('counter-bell');
  bell.classList.add('bell-ring');
  setTimeout(() => bell.classList.remove('bell-ring'), 500);

  const owner = document.getElementById('owner');
  owner.style.display = 'block';
  owner.src = IMGS.om;

  setTimeout(() => {
    owner.src = IMGS.om;
    showDialogue("Welcome to Piz-za! 🍕<br>How can I help you today?", [
      { text: "See the menu", action: () => { hideDialogue(); document.getElementById('menu-board').style.display='block'; } },
      { text: "View my cart",  action: viewCart },
      { text: "Checkout",      action: initiateCheckout }
    ]);
  }, 1000);

  bell.style.display = 'none';
  document.getElementById('instructions-counter').style.display = 'none';
}

function showDialogue(text, options) {
  const box  = document.getElementById('dialogue-box');
  document.getElementById('dialogue-text').innerHTML = text;
  const opts = document.getElementById('dialogue-options');
  opts.innerHTML = '';
  options.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = o.text;
    btn.onclick = o.action;
    opts.appendChild(btn);
  });
  box.classList.add('active');
}

function hideDialogue() { document.getElementById('dialogue-box').classList.remove('active'); }
function showMenu()     { document.getElementById('menu-display').classList.add('show'); }
function closeMenu()    { document.getElementById('menu-display').classList.remove('show'); }

function selectPizza(pizzaType) {
  closeMenu();
  const pizza = {
    type: pizzaType,
    name: pizzaTypes[pizzaType].name,
    basePrice: pizzaTypes[pizzaType].price,
    price: pizzaTypes[pizzaType].price,
    extraCheese: 0, extraToppings: 0, takeaway: false
  };
  gameState.currentPizza = pizza;

  if (pizzaTypes[pizzaType].includesAddons) {
    pizza.extraCheese = 1; pizza.extraToppings = 1;
    showDialogue(
      'Great choice! ' + pizza.name + ' already includes cheese and toppings.<br>Want to add even more?',
      [
        { text: 'Yes, add more!', action: showAddonPrompt },
        { text: 'No, continue',   action: askTakeaway }
      ]
    );
  } else {
    showAddonPrompt();
  }
}

function showAddonPrompt() {
  hideDialogue();
  gameState.addons = { cheese: 0, toppings: 0 };
  document.getElementById('cheese-count').textContent   = '0';
  document.getElementById('toppings-count').textContent = '0';
  document.getElementById('addon-prompt').classList.add('show');
}

function changeAddon(type, delta) {
  const v = Math.max(0, Math.min(10, gameState.addons[type] + delta));
  gameState.addons[type] = v;
  document.getElementById(type + '-count').textContent = v;
}

function confirmAddons() {
  document.getElementById('addon-prompt').classList.remove('show');
  const pizza = gameState.currentPizza;
  pizza.extraCheese   += gameState.addons.cheese;
  pizza.extraToppings += gameState.addons.toppings;
  pizza.price += (gameState.addons.cheese * EXTRA_CHEESE_PRICE) + (gameState.addons.toppings * EXTRA_TOPPINGS_PRICE);
  askTakeaway();
}

function askTakeaway() {
  showDialogue(
    'Takeaway or dine-in?<br>(Takeaway: +20 TK)',
    [
      { text: 'Takeaway 📦', action: () => setTakeaway(true) },
      { text: 'Dine-in 🍽️',  action: () => setTakeaway(false) }
    ]
  );
}

function setTakeaway(is) {
  const pizza = gameState.currentPizza;
  pizza.takeaway = is;
  if (is) pizza.price += TAKEAWAY_PRICE;
  addPizzaToOrder();
}

function addPizzaToOrder() {
  gameState.order.push(gameState.currentPizza);
  gameState.currentPizza = null;
  updateCartDisplay();
  showDialogue(
    '✔ Pizza added to your order!<br>What would you like to do next?',
    [
      { text: 'Order another pizza', action: () => { hideDialogue(); showMenu(); } },
      { text: 'View cart',           action: viewCart },
      { text: 'Checkout',            action: initiateCheckout }
    ]
  );
}

function updateCartDisplay() {
  const cs = document.getElementById('cart-summary');
  const ci = document.getElementById('cart-items');
  const ct = document.getElementById('cart-total');
  if (gameState.order.length === 0) { cs.style.display = 'none'; return; }
  cs.style.display = 'block';
  ci.innerHTML = '';
  let total = 0;
  gameState.order.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'cart-item';
    d.innerHTML = '#' + (i+1) + ': ' + p.name + '<br>' + (p.takeaway ? '📦' : '🍽️') + ' ' + p.price + ' TK';
    ci.appendChild(d);
    total += p.price;
  });
  ct.textContent = total;
  gameState.totalAmount = total;
}

function viewCart() {
  if (gameState.order.length === 0) {
    showDialogue('Your cart is empty! 🛒<br>Add some pizzas first!',
      [{ text: 'Order a pizza', action: () => { hideDialogue(); showMenu(); } }]);
    return;
  }
  let html = '<strong>Your Order:</strong><br><br>';
  gameState.order.forEach((p, i) => {
    html += '<div style="margin:10px 0;padding:10px;background:rgba(255,255,255,0.1);border-radius:8px;">';
    html += 'Pizza #' + (i+1) + ' - ' + p.name + ' ' + (p.takeaway ? '[TAKEAWAY]' : '[DINE-IN]') + '<br>';
    html += 'Base: ' + p.basePrice + ' TK<br>';
    if (p.extraCheese > 0) html += 'Cheese x' + p.extraCheese + ': ' + (p.extraCheese * EXTRA_CHEESE_PRICE) + ' TK<br>';
    if (p.extraToppings > 0) html += 'Toppings x' + p.extraToppings + ': ' + (p.extraToppings * EXTRA_TOPPINGS_PRICE) + ' TK<br>';
    if (p.takeaway) html += 'Takeaway: ' + TAKEAWAY_PRICE + ' TK<br>';
    html += '<strong>Subtotal: ' + p.price + ' TK</strong></div>';
  });
  html += '<br><strong style="font-size:16px;color:#ffd93d;">TOTAL: ' + gameState.totalAmount + ' TK</strong>';
  showDialogue(html, [
    { text: 'Continue shopping', action: () => { hideDialogue(); showMenu(); } },
    { text: 'Checkout',          action: initiateCheckout }
  ]);
}

function initiateCheckout() {
  if (gameState.order.length === 0) {
    showDialogue('✘ Your cart is empty!<br>Add a pizza first.',
      [{ text: 'Order a pizza', action: () => { hideDialogue(); showMenu(); } }]);
    return;
  }
  hideDialogue();
  showPaymentScreen();
}

function showPaymentScreen() {
  const screen = document.getElementById('payment-screen');
  const bill   = document.getElementById('final-bill');
  gameState.orderCounter++;
  let html = '<h2 style="color:#ffd93d;text-align:center;margin-bottom:20px;">ORDER BILL #' + gameState.orderCounter + '</h2>';
  gameState.order.forEach((p, i) => {
    html += '<div class="bill-line">';
    html += '<strong>Pizza #' + (i+1) + ' - ' + p.name + '</strong> ' + (p.takeaway ? '[TAKEAWAY]' : '[DINE-IN]') + '<br>';
    html += 'Base: ' + p.basePrice + ' TK<br>';
    if (p.extraCheese > 0) html += 'Cheese x' + p.extraCheese + ': ' + (p.extraCheese * EXTRA_CHEESE_PRICE) + ' TK<br>';
    if (p.extraToppings > 0) html += 'Toppings x' + p.extraToppings + ': ' + (p.extraToppings * EXTRA_TOPPINGS_PRICE) + ' TK<br>';
    if (p.takeaway) html += 'Takeaway: ' + TAKEAWAY_PRICE + ' TK<br>';
    html += 'Subtotal: ' + p.price + ' TK</div>';
  });
  html += '<div style="border-top:3px solid #ffd93d;margin-top:20px;padding-top:20px;text-align:center;">';
  html += '<h3 style="color:#ff6b6b;font-size:18px;">TOTAL: ' + gameState.totalAmount + ' TK</h3>';
  html += '<p style="color:rgba(255,255,255,0.7);font-size:10px;margin-top:10px;">Payment must be in multiples of 10</p></div>';
  bill.innerHTML = html;
  screen.classList.add('show');
  document.getElementById('payment-amount').value = '';
  document.getElementById('payment-error').textContent = '';
}

function processPayment() {
  const amount = parseInt(document.getElementById('payment-amount').value);
  const err    = document.getElementById('payment-error');
  err.textContent = '';
  if (isNaN(amount))                         { err.textContent = '✘ Please enter a valid number'; return; }
  if (amount % 10 !== 0)                     { err.textContent = '✘ Amount must be a multiple of 10'; return; }
  if (amount < gameState.totalAmount)        { err.textContent = '✘ Insufficient. Need at least ' + gameState.totalAmount + ' TK'; return; }
  showSuccessScreen(amount, amount - gameState.totalAmount);
}

function showSuccessScreen(paid, change) {
  document.getElementById('payment-screen').innerHTML =
    '<div class="success-screen">' +
    '<div class="pizza-emoji">🍕</div>' +
    '<h1 style="color:#6BCF7F;margin:30px 0;font-size:24px;">Payment Successful!</h1>' +
    '<div class="bill-display" style="max-width:400px;">' +
    '<div style="font-size:14px;margin:15px 0;"><strong>Amount Paid:</strong> ' + paid + ' TK</div>' +
    '<div style="font-size:14px;margin:15px 0;"><strong>Change:</strong> ' + change + ' TK</div>' +
    '<div style="border-top:3px solid #ffd93d;margin-top:20px;padding-top:20px;">' +
    '<h3 style="color:#ffd93d;font-size:16px;">Thank you! Enjoy your pizza! 🍕</h3></div></div>' +
    '<button class="payment-btn" onclick="location.reload()" style="margin-top:30px;">Start New Order</button>' +
    '</div>';
}
</script>
</body>
</html>
